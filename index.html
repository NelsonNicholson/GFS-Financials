<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GFS Financials</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<section id="lock">
  <form class="lockcard" id="lockForm" autocomplete="off">
    <img src="logo.png" alt="GFS Logistics">
    <div class="lock-eyebrow">Confidential</div>
    <h1>Financial Performance</h1>
    <p>Enter the passphrase to open the report.</p>
    <input class="field" id="pw" type="password" placeholder="Passphrase" autofocus aria-label="Passphrase">
    <label class="chk"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn primary wide" type="submit" id="unlockBtn">Open report</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="side-brand"><img src="logo.png" alt="GFS Logistics"><div><div class="side-t">Financial Performance</div><div class="side-s" id="sideCo">GFS Logistics</div></div></div>
    <nav class="side-nav" id="nav">
      <div class="side-h">Report</div>
      <button data-view="summary"><svg viewBox="0 0 20 20"><path d="M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z"/></svg>Executive Summary</button>
      <button data-view="pl"><svg viewBox="0 0 20 20"><path d="M4 3h12v14H4zM7 7h6M7 10h6M7 13h4"/></svg>Income Statement</button>
      <button data-view="compare"><svg viewBox="0 0 20 20"><path d="M4 16V8M8 16V4M12 16v-6M16 16V6"/></svg>Month Compare</button>
      <div class="side-h">Operations</div>
      <button data-view="sales"><svg viewBox="0 0 20 20"><path d="M7 8a3 3 0 1 0 0-.01M2 17c.7-3 2.6-4.5 5-4.5s4.3 1.5 5 4.5M13 4.5a3 3 0 0 1 0 5.6M15 12.6c1.5.5 2.5 1.9 3 4.4"/></svg>Customers</button>
      <button data-view="labor"><svg viewBox="0 0 20 20"><path d="M10 3a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM5 17v-2.5A3.5 3.5 0 0 1 8.5 11h3a3.5 3.5 0 0 1 3.5 3.5V17M3 17h14"/></svg>Warehouse Labor</button>
      <button data-view="move"><svg viewBox="0 0 20 20"><path d="M2 14h11V5H2zM13 8h3l2 3v3h-5M5 16.5a1.5 1.5 0 1 0 0-.01M15 16.5a1.5 1.5 0 1 0 0-.01"/></svg>G3 Move</button>
      <button data-view="ar"><svg viewBox="0 0 20 20"><path d="M3 5h14v10H3zM3 8h14M6 12h3"/></svg>Receivables</button>
      <div class="side-h">Setup</div>
      <button data-view="admin"><svg viewBox="0 0 20 20"><path d="M10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>Inputs<span class="badge hidden" id="admBadge"></span></button>
    </nav>
    <div class="side-foot">
      <button class="side-export" id="pkgBtn"><svg viewBox="0 0 20 20"><path d="M10 3v9M6 8.5l4 4 4-4M4 15h12"/></svg>Export financials package</button>
      <div class="live" id="liveBadge"><i></i><span id="liveText">Live</span></div>
      <div class="side-actions"><button class="ghost" id="themeBtn">Light / dark</button><button class="ghost" id="lockBtn">Lock</button></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu" id="menuBtn" aria-label="Menu">☰</button>
      <div class="tb-title"><div class="eyebrow" id="pgEyebrow"></div><h1 id="pgTitle"></h1></div>
      <div class="tb-ctrls">
        <label class="ctl"><span>Reporting month</span><select id="repMonth" aria-label="Reporting month"></select></label>
      </div>
    </header>
    <div id="banners" class="wrap"></div>
    <main id="view" class="wrap"></main>
    <footer id="foot" class="wrap"></footer>
  </div>
</div>

<div id="scrim" class="hidden"></div>
<aside id="drawer" class="hidden" aria-modal="true" role="dialog">
  <header><div class="d-head"><div class="eyebrow" id="dKicker"></div><h3 id="dTitle"></h3></div>
    <button class="btn" id="dCsv">Export CSV</button><button class="close" id="dClose" aria-label="Close">×</button></header>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="tip hidden" id="tip"></div>
<div class="loading hidden" id="loading"><div class="spin"></div><span id="loadingText">Loading…</span></div>
<script src="app.js"></script>
</body>
</html>
